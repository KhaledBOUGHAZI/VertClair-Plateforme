<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

<rect width="900" height="500" fill="#f8fafc"></rect>

<text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">
    Le réchauffement climatique
</text>

<!-- Axe horizontal -->
<line x1="130" y1="355" x2="790" y2="355" stroke="#334155" stroke-width="5" stroke-linecap="round"></line>
<path d="M770 335 L805 355 L770 375" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>

<!-- Axe vertical -->
<line x1="130" y1="355" x2="130" y2="120" stroke="#334155" stroke-width="5" stroke-linecap="round"></line>

<text x="95" y="360" text-anchor="end" font-family="Arial" font-size="18" fill="#334155">0°C</text>
<text x="95" y="315" text-anchor="end" font-family="Arial" font-size="18" fill="#334155">1°C</text>
<text x="95" y="270" text-anchor="end" font-family="Arial" font-size="18" fill="#334155">2°C</text>
<text x="95" y="225" text-anchor="end" font-family="Arial" font-size="18" fill="#334155">3°C</text>
<text x="95" y="180" text-anchor="end" font-family="Arial" font-size="18" fill="#334155">4°C</text>
<text x="95" y="135" text-anchor="end" font-family="Arial" font-size="18" fill="#334155">5°C</text>

<!-- Repères années -->
<circle cx="160" cy="305" r="7" fill="#334155"></circle>
<circle cx="450" cy="275" r="7" fill="#334155"></circle>
<circle cx="760" cy="355" r="7" fill="#334155"></circle>

<text x="160" y="390" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#334155">2025</text>
<text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#334155">2050</text>
<text x="760" y="390" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#334155">2100</text>

<!-- Point de départ -->
<circle cx="160" cy="305" r="10" fill="#0f172a"></circle>
<text x="165" y="285" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">≈ +1,2°C</text>

<!-- Courbe basse -->
<polyline points="160,305 450,280 760,275" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></polyline>
<circle cx="450" cy="280" r="10" fill="#22c55e"></circle>
<circle cx="760" cy="275" r="10" fill="#22c55e"></circle>
<text x="610" y="265" font-family="Arial" font-size="21" font-weight="700" fill="#166534">2100 : +1,8°C</text>

<!-- Courbe intermédiaire -->
<polyline points="160,305 450,245 760,230" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></polyline>
<circle cx="450" cy="245" r="10" fill="#f59e0b"></circle>
<circle cx="760" cy="230" r="10" fill="#f59e0b"></circle>
<text x="610" y="220" font-family="Arial" font-size="21" font-weight="700" fill="#92400e">2100 : +2,7°C</text>

<!-- Courbe haute -->
<polyline points="160,305 450,205 760,165" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></polyline>
<circle cx="450" cy="205" r="10" fill="#ef4444"></circle>
<circle cx="760" cy="165" r="10" fill="#ef4444"></circle>
<text x="610" y="155" font-family="Arial" font-size="21" font-weight="700" fill="#991b1b">2100 : +4,4°C</text>

<!-- Repère 2050 -->
<line x1="450" y1="355" x2="450" y2="205" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 6"></line>
<rect x="305" y="105" width="290" height="65" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"></rect>
<text x="450" y="132" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#075985">
    Vers 2050
</text>
<text x="450" y="157" text-anchor="middle" font-family="Arial" font-size="17" fill="#075985">
    environ +1,7°C à +2,4°C
</text>

<!-- Source -->
<rect x="115" y="425" width="670" height="52" rx="16" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"></rect>
<text x="450" y="447" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#166534">
    Source : GIEC (IPCC) - Rapport AR6
</text>
<text x="450" y="468" text-anchor="middle" font-family="Arial" font-size="15" fill="#166534">
    Réchauffement mondial moyen par rapport à 1850-1900.
</text>

</svg>