<text x="450" y="222" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Pétrole</text>

<rect x="630" y="135" width="190" height="105" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="3"></rect>
<text x="725" y="180" text-anchor="middle" font-size="36">🔥</text>
<text x="725" y="222" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Gaz naturel</text>

