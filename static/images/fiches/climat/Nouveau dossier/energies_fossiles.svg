<path d="M535 318 L505 337 L540 345" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>

<!-- CO2 -->
<circle cx="450" cy="350" r="50" fill="#fee2e2" stroke="#ef4444" stroke-width="3"></circle>
<text x="450" y="362" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#991b1b">
