</text>

<rect x="80" y="135" width="190" height="105" rx="20" fill="#e2e8f0" stroke="#64748b" stroke-width="3"></rect>
<text x="175" y="180" text-anchor="middle" font-size="36">🪨</text>
<text x="175" y="222" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Charbon</text>

