<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

    <rect width="900" height="500" fill="#f8fafc"></rect>

    <text x="450" y="60" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">
        L’effet de serre
    </text>

    <!-- Soleil -->
    <rect x="70" y="120" width="200" height="220" rx="25" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"></rect>

    <text x="170" y="175" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#92400e">
        Soleil
    </text>

    <text x="170" y="260" text-anchor="middle" font-size="75">
        ☀️
    </text>

    <!-- Flèche 1 -->
    <path d="M295 230 H365" stroke="#64748b" stroke-width="10" stroke-linecap="round"></path>
    <path d="M340 205 L380 230 L340 255" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Terre -->
    <rect x="395" y="120" width="200" height="220" rx="25" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"></rect>

    <text x="495" y="175" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1e3a8a">
        Terre
    </text>

    <text x="495" y="260" text-anchor="middle" font-size="75">
        🌍
    </text>

    <!-- Flèche 2 -->
    <path d="M620 230 H690" stroke="#64748b" stroke-width="10" stroke-linecap="round"></path>
    <path d="M665 205 L705 230 L665 255" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Chaleur retenue -->
    <rect x="720" y="120" width="120" height="220" rx="25" fill="#fee2e2" stroke="#ef4444" stroke-width="3"></rect>

    <text x="780" y="175" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#991b1b">
        Chaleur
    </text>

    <text x="780" y="210" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#991b1b">
        retenue
    </text>

    <text x="780" y="285" text-anchor="middle" font-size="62">
        🌡️
    </text>

    <!-- GES -->
    <rect x="315" y="365" width="270" height="55" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3"></rect>

    <text x="450" y="400" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#166534">
        CO₂  CH₄  N₂O  ...
    </text>

    <!-- Message clé -->
    <text x="450" y="455" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#166534">
        Les gaz à effet de serre retiennent une partie de la chaleur.
    </text>

</svg>