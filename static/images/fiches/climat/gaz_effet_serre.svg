<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

  <rect width="900" height="500" fill="#f8fafc"></rect>

  <text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">
    Les gaz à effet de serre
  </text>

  <text x="450" y="95" text-anchor="middle" font-family="Arial" font-size="21" fill="#475569">
    Ils retiennent une partie de la chaleur dans l’atmosphère
  </text>

  <rect x="110" y="145" width="160" height="190" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"></rect>
  <text x="190" y="210" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#1e3a8a">
    CO₂
  </text>
  <text x="190" y="270" text-anchor="middle" font-family="Arial" font-size="21" fill="#1e40af">
    Carbone
  </text>

  <rect x="300" y="145" width="160" height="190" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="3"></rect>
  <text x="380" y="210" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#14532d">
    CH₄
  </text>
  <text x="380" y="270" text-anchor="middle" font-family="Arial" font-size="21" fill="#166534">
    Méthane
  </text>

  <rect x="490" y="145" width="160" height="190" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"></rect>
  <text x="570" y="210" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#92400e">
    N₂O
  </text>
  <text x="570" y="270" text-anchor="middle" font-family="Arial" font-size="21" fill="#92400e">
    Protoxyde
  </text>
  <text x="570" y="298" text-anchor="middle" font-family="Arial" font-size="21" fill="#92400e">
    d’azote
  </text>

  <rect x="680" y="145" width="110" height="190" rx="24" fill="#fee2e2" stroke="#f87171" stroke-width="3"></rect>
  <text x="735" y="215" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#991b1b">
    ...
  </text>
  <text x="735" y="270" text-anchor="middle" font-family="Arial" font-size="21" fill="#991b1b">
    autres
  </text>

  <text x="450" y="410" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#166534">
    Naturels, mais problématiques quand leur quantité augmente.
  </text>

  <text x="450" y="450" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">
    Leur augmentation est principalement liée aux activités humaines.
  </text>

</svg>