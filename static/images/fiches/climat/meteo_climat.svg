<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

    <rect width="900" height="500" fill="#f8fafc"></rect>

    <text x="450" y="60" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">
        Météo ou climat ?
    </text>

    <!-- Bloc météo -->

    <rect x="80" y="120" width="280" height="220" rx="25" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"></rect>

    <text x="220" y="170" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1e3a8a">
        MÉTÉO
    </text>

    <text x="220" y="250" text-anchor="middle" font-size="70">
        ☀️🌧️
    </text>

    <text x="220" y="310" text-anchor="middle" font-family="Arial" font-size="24" fill="#1e40af">
        Quelques jours
    </text>

    <!-- Flèche -->

    <path d="M390 230 H510" stroke="#64748b" stroke-width="10" stroke-linecap="round"></path>

    <path d="M485 205 L525 230 L485 255" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Bloc climat -->

    <rect x="540" y="120" width="280" height="220" rx="25" fill="#dcfce7" stroke="#22c55e" stroke-width="3"></rect>

    <text x="680" y="170" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#14532d">
        CLIMAT
    </text>

    <text x="680" y="250" text-anchor="middle" font-size="75">
        🌍
    </text>

    <text x="680" y="310" text-anchor="middle" font-family="Arial" font-size="24" fill="#166534">
        30 ans ou plus
    </text>

    <!-- Message clé -->

    <text x="450" y="430" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#166534">
        Le climat est une tendance longue.
    </text>

    <text x="450" y="465" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">
        Une journée froide ne remet pas en cause le réchauffement climatique.
    </text>

</svg>