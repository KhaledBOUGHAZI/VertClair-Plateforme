{% extends "base.html" %}

{% block title %}Nouvelle organisation{% endblock %}

{% block content %}

<div class="container-fluid mt-4">

    <a href="{% url 'fenny_organisations' %}" class="btn btn-outline-secondary mb-3">
        ← Retour aux organisations
    </a>

    <h1>➕ Nouvelle organisation</h1>
    <p class="text-muted">Créer une nouvelle organisation cliente VertClair.</p>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Nom de l'organisation</label>
                    <input type="text" name="nom" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Type</label>
                    <select name="type_organisation" class="form-select" required>
                        <option value="entreprise">Entreprise</option>
                        <option value="commune">Commune / collectivité</option>
                        <option value="association">Association</option>
                        <option value="particulier">Particulier</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Téléphone</label>
                    <input type="text" name="telephone" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">SIRET</label>
                    <input type="text" name="siret" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label">Adresse</label>
                    <textarea name="adresse" class="form-control" rows="3"></textarea>
                </div>

                <button class="btn btn-success">
                    Créer l'organisation
                </button>

                <a href="{% url 'fenny_organisations' %}" class="btn btn-outline-secondary">
                    Annuler
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
