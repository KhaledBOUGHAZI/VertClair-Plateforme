{% extends "base.html" %}

{% block title %}Modifier utilisateur{% endblock %}

{% block content %}

<div class="container-fluid mt-4">

    <a href="{% url 'fenny_detail_utilisateur' profil.id %}" class="btn btn-outline-secondary mb-3">
        ← Retour à l'utilisateur
    </a>

    <h1>✏ Modifier l'utilisateur</h1>
    <p class="text-muted">{{ profil.user.username }}</p>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Prénom</label>
                        <input type="text" name="first_name" class="form-control" value="{{ profil.user.first_name }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" name="last_name" class="form-control" value="{{ profil.user.last_name }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ profil.user.email }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Fonction</label>
                    <input type="text" name="fonction" class="form-control" value="{{ profil.fonction|default:'' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Téléphone</label>
                    <input type="text" name="telephone" class="form-control" value="{{ profil.telephone|default:'' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Service</label>
                    <select name="service" class="form-select">
                        <option value="">Aucun service</option>
                        {% for service in services %}
                            <option value="{{ service.id }}" {% if profil.service and profil.service.id == service.id %}selected{% endif %}>
                                {{ service.nom }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Rôle</label>
                    <select name="role" class="form-select">
                        <option value="admin_org" {% if profil.role == "admin_org" %}selected{% endif %}>Administrateur d’organisation</option>
                        <option value="gestionnaire" {% if profil.role == "gestionnaire" %}selected{% endif %}>Gestionnaire</option>
                        <option value="utilisateur" {% if profil.role == "utilisateur" %}selected{% endif %}>Utilisateur</option>
                        <option value="lecteur" {% if profil.role == "lecteur" %}selected{% endif %}>Lecteur</option>
                    </select>
                </div>

                <button class="btn btn-success">Enregistrer</button>

                <a href="{% url 'fenny_detail_utilisateur' profil.id %}" class="btn btn-outline-secondary">
                    Annuler
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
