{% load static %}

<div class="col-xl-4 col-lg-6 mb-4">
    <div class="card shadow-sm border-0 h-100" style="border-radius: 18px; overflow: hidden;">

        <img
            src="{% static image %}"
            class="card-img-top"
            style="height: 150px; object-fit: cover;"
            alt="{{ titre }}"
        >

        <div class="card-body">

            <h4>{{ titre }}</h4>

            <p class="text-muted">
                {{ texte }}
            </p>

            <div class="progress mb-2" style="height: 8px;">
                <div
                    class="progress-bar bg-success"
                    style="width: {{ progression }}%;">
                </div>
            </div>

            <small class="text-muted">
                Progression : {{ progression }} %
            </small>

            <div class="mt-3">
                <a href="{% url 'quiz_session' theme 'debutant' %}" class="btn btn-success btn-sm mb-1">
                    🟢 Débutant
                </a>

                <a href="{% url 'quiz_session' theme 'connaisseur' %}" class="btn btn-warning btn-sm mb-1">
                    🟠 Connaisseur
                </a>

                <a href="{% url 'quiz_session' theme 'expert' %}" class="btn btn-danger btn-sm mb-1">
                    🔴 Expert
                </a>
            </div>

        </div>
    </div>
</div>
